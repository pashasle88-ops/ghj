<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перспектива ТЦ - Обслуживание систем безопасности</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="proekt.css">
    
    <!-- SEO -->
    <meta name="description" content="Обслуживание домофонов, видеонаблюдения и шлагбаумов в Москве и МО. 25 лет опыта. Гарантия 12 месяцев.">
    <meta name="keywords" content="домофоны, видеонаблюдение, шлагбаумы, обслуживание, ремонт, Москва">
</head>
<body>
    <!-- Заголовок -->
    <div id="header-placeholder"></div>
    
    <!-- Контент из proekt.html -->
    <div id="content-placeholder"></div>
    
    <!-- Подвал -->
    <div id="footer-placeholder"></div>
    
    <!-- Виджеты и модальные окна -->
    <div id="widgets-placeholder"></div>
    
    <!-- Все скрипты -->
    <script src="proekt.js"></script>
    
    <script>
        // Загружаем содержимое proekt.html
        fetch('proekt.html')
            .then(response => response.text())
            .then(html => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                
                // Извлекаем нужные части
                const header = tempDiv.querySelector('header');
                const footer = tempDiv.querySelector('footer');
                const mainContent = tempDiv.querySelectorAll('section, .support-widget, .mini-chat');
                const widgets = tempDiv.querySelector('.support-widget, .mini-chat, .scroll-top');
                
                // Вставляем в соответствующие места
                if (header) document.getElementById('header-placeholder').replaceWith(header);
                if (footer) document.getElementById('footer-placeholder').replaceWith(footer);
                
                if (mainContent.length) {
                    const contentDiv = document.getElementById('content-placeholder');
                    mainContent.forEach(section => {
                        if (!section.classList.contains('support-widget') && 
                            !section.classList.contains('mini-chat')) {
                            contentDiv.appendChild(section);
                        }
                    });
                    contentDiv.style.display = 'none';
                }
                
                if (widgets) {
                    document.getElementById('widgets-placeholder').replaceWith(widgets);
                }
                
                // Инициализируем все скрипты
                setTimeout(() => {
                    if (window.initAllFunctions) {
                        window.initAllFunctions();
                    }
                }, 100);
            })
            .catch(error => {
                console.error('Ошибка загрузки контента:', error);
                document.getElementById('content-placeholder').innerHTML = `
                    <div style="text-align:center; padding:50px;">
                        <h2>Сайт временно недоступен</h2>
                        <p>Пожалуйста, свяжитесь с нами по телефону: +7 (495) 316-77-27</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
